# ==============================================================
# Agent 评测专用配置
#
# 目标：让 Spring 上下文能在「无 MySQL、无网络、无 API Key」的环境下装配起来，
#      使 Agent 评测可以在 CI 中常态运行。
#
# 注意：这里用 H2 只是为了让 JPA 能初始化。评测用例中所有涉及
#      MySQL 原生 SQL 的组件（RagSearchService 的 ngram FULLTEXT 等）
#      都必须用 @MockBean 替换，不能穿透到真实查询。
# ==============================================================

spring.application.name=Lattice-Planner-AgentEval

# ---- 内存库：仅用于装配，不承载业务断言 ----
spring.datasource.url=jdbc:h2:mem:agenteval;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---- 收敛日志噪声，让评测报告清晰可读 ----
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.zhzssp.memorandum=INFO
logging.level.org.zhzssp.memorandum.agenteval=INFO

# ---- LLM：回放模式下不会真正使用，占位避免启动校验失败 ----
agent.llm.api-key=test-key-not-used-in-replay
agent.llm.base-url=https://api.deepseek.com
agent.llm.model=deepseek-chat
agent.llm.default-model=deepseek-chat

agent.llm.providers[0].id=deepseek
agent.llm.providers[0].display-name=DeepSeek
agent.llm.providers[0].type=OPENAI_COMPATIBLE
agent.llm.providers[0].endpoints[0].base-url=https://api.deepseek.com
agent.llm.providers[0].endpoints[0].api-key=test-key-not-used-in-replay
agent.llm.providers[0].endpoints[0].weight=1

agent.llm.models[0].id=deepseek-chat
agent.llm.models[0].display-name=DeepSeek Chat
agent.llm.models[0].provider-id=deepseek
agent.llm.models[0].enabled=true

agent.embedding.api-key=test-key-not-used-in-replay
agent.embedding.base-url=https://api.siliconflow.cn
agent.embedding.model=BAAI/bge-m3

# ---- ReAct：步数放小，让"步数耗尽"用例能快速触发 ----
agent.chat.max-steps=8
agent.chat.history-window=30

# ---- 关闭所有后台任务：评测要的是确定性，不要定时器干扰 ----
report.proactive.enabled=false
mcp.server.enabled=false
mcp.client.enabled=false
mcp.server.local-files-enabled=false

# ---- 前缀缓存保持开启：评测应覆盖真实的缓存路径 ----
agent.prefix-cache.enabled=true
agent.prefix-cache.max-entries=256
agent.prefix-cache.expire-minutes=120

# ---- CRAG / RAG Serving 保持开启：这些分支要被真实执行 ----
pkm.crag.enabled=true
pkm.crag.upper=0.6
pkm.crag.lower=0.4
pkm.rag.serving.query-cache.enabled=false
pkm.rag.serving.rerank.enabled=false

# ---- 子代理：缩小规模加快评测 ----
agent.subagent.max-steps=6
agent.subagent.result-max-chars=4000
agent.subagent.parallel.size=2
agent.subagent.parallel.timeout-seconds=30

# ---- 关闭定时任务调度 ----
spring.task.scheduling.pool.size=1

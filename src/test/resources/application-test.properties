# ==============================================================
# contextLoads 专用配置：只把 datasource 换成 H2，其余一律沿用生产默认值。
#
# 为什么只换 datasource
# ------------------------------
# contextLoads 的价值在于证明【生产装配能起来】：每个 bean 都能构造、
# 依赖都能解析、每个 @ConfigurationProperties 都能完成绑定。
# 它唯一起不来的原因是本机没有 MySQL——Hibernate 拿不到 JDBC metadata，
# 报的却是 "Unable to determine Dialect"，这句话很容易被误读成"少配了 dialect"。
#
    10># 为什么不复用 application-agenteval.properties
# ------------------------------
# 先说一个【不成立】的理由，免得日后有人照着错的前提改：项目里没有任何
# @ConditionalOnProperty / @Profile，所以两份配置装配出来的 bean 集合是【完全一样】的。
# "复用 agenteval 会少创建一批 bean"——这个说法是错的。
#
# 真实的差别在【启动期的运行分支】。ApplicationReadyEvent 在 @SpringBootTest 里
# 确实会触发，于是这些监听器会真的跑起来：
#   McpClientManager   → mcp.client.enabled=true 时真的去连 loopback
#   ToolRegistry       → 实测注册 63 个本地工具
#   CodexSearchService → 注册 Git 文档向量加载器
# agenteval 把 mcp.client/server、定时任务、查询缓存全关了，这些分支就都不执行。
    20>#
# 还有一条只有生产配置才覆盖得到：agent.llm.api-key 是 ${DEEPSEEK_API_KEY:}，
# 未设环境变量时为【空】。agenteval 填了占位 key。所以这份配置额外证明了
# "全新 clone、一个 API Key 都没配" 时应用照样能启动。
#
# 一句话：agenteval 那份追求确定性，这份追求覆盖面。目标冲突，不该合并。
# ==============================================================

# ---- 唯一的替换项 ----
# MODE=MySQL：实体与原生 SQL 按 MySQL 方言写，H2 需对齐才能建表。
    30># NON_KEYWORDS=USER：实体表名就叫 user，而 USER 是 H2 2.x 保留字，
#   不声明的话建表直接 42001 语法错。
spring.datasource.url=jdbc:h2:mem:contextload;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 生产是 update（对着长期存在的库做增量 DDL）；内存库每次从零开始，只能 create-drop。
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

    40># ---- 唯一的调参项：MCP loopback 连接超时 10s → 1s ----
# 这里【不关闭】MCP client：连不上时能否优雅降级启动，正是值得覆盖的一条路径
# （生产启动瞬间 8080 也还没开始监听，所以这就是真实场景）。
# 但 @SpringBootTest 默认 MOCK 环境不绑端口，这个连接注定超时，
# 按默认 10s 等下去等于每次 gradlew test 白白多花 10 秒。
# 降到 1s：同一条分支照跑、失败处理照走，代价降一个数量级。
mcp.client.servers.loopback.connect-timeout=1

# ---- 日志降噪 ----
# 生产开了 SQL DEBUG + Spring DEBUG，建表时会刷出上万行，把真正的失败原因淹掉。
    50>spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework=WARN

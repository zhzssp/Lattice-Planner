<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<body>
<!--
  Lattice-Agent 对话面板 fragment。
  在登录后页面 </body> 之前以 <div th:replace="~{fragments/agent-panel :: panel}"></div> 引入。
-->
<div class="lp-agent-mount" th:fragment="panel">
    <!-- 内联样式压过 Electron persist 缓存的旧 chat-panel.css（旧文件把面板写成 position:fixed） -->
    <style id="lp-agent-split-inline">
        #lp-agent-layout-chip { position: fixed !important; left: 8px !important; bottom: 8px !important; z-index: 2147483646 !important; background: #111827 !important; color: #86efac !important; font: 11px/1.2 ui-monospace, Consolas, monospace !important; padding: 4px 7px !important; border-radius: 4px !important; pointer-events: none !important; opacity: .85 !important; }
        .lp-page-shell { display: flex !important; flex-direction: row !important; align-items: stretch !important; width: 100% !important; min-height: 100vh !important; box-sizing: border-box !important; }
        .lp-page-main { flex: 1 1 auto !important; min-width: 0 !important; overflow: auto !important; }
        .lp-agent-mount, #lp-agent-host { flex: 0 0 0 !important; width: 0 !important; min-width: 0 !important; overflow: hidden !important; align-self: stretch !important; }
        html.lp-agent-open, html.lp-agent-open body, html:has(#lp-agent-panel.open), html:has(#lp-agent-panel.open) body { height: 100vh !important; overflow: hidden !important; }
        html.lp-agent-open .lp-page-shell, html:has(#lp-agent-panel.open) .lp-page-shell, .lp-page-shell:has(#lp-agent-panel.open) { height: 100vh !important; overflow: hidden !important; }
        html.lp-agent-open .lp-agent-mount, html.lp-agent-open #lp-agent-host, html:has(#lp-agent-panel.open) .lp-agent-mount, .lp-page-shell:has(#lp-agent-panel.open) .lp-agent-mount { flex: 0 0 var(--lp-agent-width, 440px) !important; width: var(--lp-agent-width, 440px) !important; max-width: var(--lp-agent-width, 440px) !important; }
        html.lp-agent-open .lp-page-main, html:has(#lp-agent-panel.open) .lp-page-main { max-width: calc(100% - var(--lp-agent-width, 440px)) !important; }
        #lp-agent-panel, #lp-agent-panel.open { position: relative !important; top: auto !important; right: auto !important; left: auto !important; bottom: auto !important; inset: auto !important; transform: none !important; width: 100% !important; height: 100% !important; max-width: none !important; z-index: 2 !important; }
        html.lp-agent-open #lp-agent-fab, html:has(#lp-agent-panel.open) #lp-agent-fab, .lp-page-shell:has(#lp-agent-panel.open) #lp-agent-fab { display: none !important; }
        html.lp-agent-open .container, html.lp-agent-open .note-page, html.lp-agent-open .memo-form-container, html.lp-agent-open .mcp-container, html:has(#lp-agent-panel.open) .container, html:has(#lp-agent-panel.open) .note-page, html:has(#lp-agent-panel.open) .memo-form-container, html:has(#lp-agent-panel.open) .mcp-container { max-width: none !important; width: auto !important; box-sizing: border-box !important; }
    </style>
    <link rel="stylesheet" th:href="@{/agent/chat-panel.css(v=11)}">
    <button id="lp-agent-fab" type="button" title="打开 Lattice-Agent（layout split-v11）">AI</button>
    <aside id="lp-agent-panel" aria-hidden="true">
        <div id="lp-agent-resizer" title="拖拽调整宽度"></div>
        <header>
            <span class="lp-agent-title">Lattice-Agent</span>
            <select id="lp-agent-mode" title="模式">
                <option value="chat">Chat</option>
                <option value="plan">自动规划</option>
                <option value="reflect">复盘</option>
            </select>
            <select id="lp-agent-model" title="模型"></select>
            <button id="lp-agent-settings-btn" type="button" title="Agent 设置">⚙ 设置</button>
            <button id="lp-agent-close" type="button" title="关闭">×</button>
        </header>
        <ol id="lp-agent-stream"></ol>
        <!-- Agent 设置面板 -->
        <div id="lp-agent-settings" class="lp-settings" aria-hidden="true">
            <div class="lp-settings-header">
                <span class="lp-settings-title">Agent 设置</span>
                <button id="lp-settings-close" type="button" class="lp-settings-close-btn">×</button>
            </div>
            <div class="lp-settings-body">
                <div class="lp-settings-section">
                    <div class="lp-settings-label">自动允许的工具（勾选后调用免确认）</div>
                    <div id="lp-settings-tools-list" class="lp-settings-tools"></div>
                </div>
            </div>
            <div class="lp-settings-footer">
                <button id="lp-settings-save" type="button" class="lp-settings-save">保存</button>
                <span id="lp-settings-status" class="lp-settings-status"></span>
            </div>
        </div>
        <footer>
            <textarea id="lp-agent-input" placeholder="向 Agent 提问，按 Ctrl+Enter 发送…"></textarea>
            <div class="lp-agent-actions">
                <span id="lp-agent-status" class="lp-agent-status">未连接</span>
                <button id="lp-agent-send" type="button">发送</button>
            </div>
        </footer>
    </aside>
    <script id="lp-agent-layout-boot" th:src="@{/agent/layout-boot.js(v=11)}"></script>
    <script th:src="@{/agent/chat-panel.js(v=11)}"></script>
</div>
</body>
</html>

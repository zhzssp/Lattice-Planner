<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<body>
<!--
  Codex 工作台顶栏：独立于三模式 Dashboard。
  各 /codex* 页在容器顶部以
    <div th:replace="~{fragments/codex-nav :: chrome}"></div>
  引入。选中态由 Model 的 codexNav 决定。
-->
<header class="cx-workbench" th:fragment="chrome">
    <div class="cx-workbench-bar">
        <h1 class="cx-workbench-title">知识仓库</h1>
        <div class="cx-workbench-right">
            <span id="cx-autosync" class="cx-workbench-sync" aria-live="polite"></span>
            <a class="cx-workbench-back" href="/dashboard">返回 Dashboard</a>
        </div>
    </div>
    <nav class="cx-seg" aria-label="知识仓库分区">
        <a href="/codex" class="cx-seg-item"
           title="当前路径、要点、投影任务与收敛"
           th:classappend="${codexNav=='path'} ? ' is-active'"
           th:aria-current="${codexNav=='path'} ? 'page'">路径</a>
        <a href="/codex/distill" class="cx-seg-item"
           title="原料列表、蒸馏、路径补丁预览"
           th:classappend="${codexNav=='distill'} ? ' is-active'"
           th:aria-current="${codexNav=='distill'} ? 'page'">资料</a>
        <a href="/codex/checkpoints" class="cx-seg-item"
           title="先预测再跑检验"
           th:classappend="${codexNav=='checkpoints'} ? ' is-active'"
           th:aria-current="${codexNav=='checkpoints'} ? 'page'">检验</a>
        <a href="/codex/gaps" class="cx-seg-item"
           title="三源合流台账与止损线"
           th:classappend="${codexNav=='gaps'} ? ' is-active'"
           th:aria-current="${codexNav=='gaps'} ? 'page'">缺口</a>
        <a href="/codex/curate" class="cx-seg-item"
           title="CI、沉淀、分支——维护面"
           th:classappend="${codexNav=='curate'} ? ' is-active'"
           th:aria-current="${codexNav=='curate'} ? 'page'">策展</a>
    </nav>
</header>
<script>
(function () {
    const KEY = 'codex.autosync.ts';
    const last = Number(sessionStorage.getItem(KEY) || '0');
    if (Date.now() - last < 8000) return;
    sessionStorage.setItem(KEY, String(Date.now()));
    const token = document.querySelector('meta[name="_csrf"]')?.content;
    const headerName = document.querySelector('meta[name="_csrf_header"]')?.content;
    const headers = { 'Content-Type': 'application/json' };
    if (token && headerName) headers[headerName] = token;
    fetch('/api/codex/repos/autosync', { method: 'POST', headers: headers })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            var el = document.getElementById('cx-autosync');
            if (el && d && d.message) el.textContent = d.message;
        })
        .catch(function () { /* 自动同步失败不挡浏览 */ });
})();
</script>
</body>
</html>

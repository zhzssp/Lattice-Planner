<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<body>
<!--
  知识目的地二级导航。应用级顶栏见 fragments/app-nav。
  选中态由 Model 的 codexNav 决定。检验/缺口/策展算「工具」。
-->
<header class="cx-workbench" th:fragment="chrome">
    <div class="cx-workbench-bar">
        <span id="cx-autosync" class="cx-workbench-sync" aria-live="polite"></span>
    </div>
    <nav class="cx-seg" aria-label="知识分区">
        <a href="/codex" class="cx-seg-item"
           title="路径、要点、投影任务"
           th:classappend="${codexNav=='path'} ? ' is-active'"
           th:aria-current="${codexNav=='path'} ? 'page'">体系</a>
        <a href="/codex/distill" class="cx-seg-item"
           title="原料阅读与蒸馏"
           th:classappend="${codexNav=='distill'} ? ' is-active'"
           th:aria-current="${codexNav=='distill'} ? 'page'">资料</a>
        <a href="/codex/notes" class="cx-seg-item"
           title="Git 笔记与随手记收件箱"
           th:classappend="${codexNav=='notes'} ? ' is-active'"
           th:aria-current="${codexNav=='notes'} ? 'page'">笔记</a>
        <a href="/codex/tools" class="cx-seg-item"
           title="接入仓库、检验、缺口、策展"
           th:classappend="${codexNav=='tools' or codexNav=='checkpoints' or codexNav=='gaps' or codexNav=='curate'} ? ' is-active'"
           th:aria-current="${codexNav=='tools' or codexNav=='checkpoints' or codexNav=='gaps' or codexNav=='curate'} ? 'page'">工具</a>
    </nav>
</header>
<script>
(function () {
    const KEY = 'codex.autosync.ts';
    const last = Number(sessionStorage.getItem(KEY) || '0');
    if (Date.now() - last < 8000) return;
    sessionStorage.setItem(KEY, String(Date.now()));
    const token = document.querySelector('meta[name="_csrf"]')?.content;
    const headerName = document.querySelector('meta[name="_csrf_header"]')?.content;
    const headers = { 'Content-Type': 'application/json' };
    if (token && headerName) headers[headerName] = token;
    fetch('/api/codex/repos/autosync', { method: 'POST', headers: headers })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            var el = document.getElementById('cx-autosync');
            if (el && d && d.message) el.textContent = d.message;
        })
        .catch(function () { /* 自动同步失败不挡浏览 */ });
})();
</script>
</body>
</html>

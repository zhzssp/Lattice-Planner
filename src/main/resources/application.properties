# Configuration File
# self-defined content, auto-detected content
# another way: application.yml/.yaml, but .properties has the highest priority, then .yml and .yaml

# server.port=8080

spring.application.name=Lattice-Planner

# Database Configuration
# mysql 5.x is different from 8.x --> time zone
spring.datasource.url=jdbc:mysql://localhost:3306/memo_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# Hibernate and JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# DEBUG Info Display
logging.level.org.springframework=DEBUG

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=1800

# MyBatis Configuration
mybatis.mapper-locations=classpath*:mapper/*.xml

# ==============================
# Agent / LLM (Phase 1, DeepSeek)
# 请在拿到 key 后填入：
agent.llm.api-key=sk-f7004a5b17d44e6da9d8e45298b97bf0
# 可选：DeepSeek API 基础地址（默认 https://api.deepseek.com）
agent.llm.base-url=https://api.deepseek.com
# 可选模型：deepseek-chat / deepseek-reasoner
agent.llm.model=deepseek-reasoner
# AI 总结调用模型的等待时间，单位：秒
agent.llm.summary-timeout-seconds=60

# ==============================
# Agent Chat（多轮对话/工具调用）
# 多轮对话强制使用 deepseek-chat：reasoner 输出 reasoning_content/<think> 段会干扰 JSON 解析
agent.chat.model=deepseek-chat
# 单次用户输入最多允许的 ReAct 步数（防工具循环）
agent.chat.max-steps=8
# 短期会话窗口大小（条数）
agent.chat.history-window=30
# 会话空闲多少分钟后归档为长期记忆
agent.chat.session-idle-archive-minutes=30

?# Configuration File
# self-defined content, auto-detected content
# another way: application.yml/.yaml, but .properties has the highest priority, then .yml and .yaml

# server.port=8080

spring.application.name=Lattice-Planner

# Database Configuration
# mysql 5.x is different from 8.x --> time zone
spring.datasource.url=jdbc:mysql://localhost:3306/memo_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# Hibernate and JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# DEBUG Info Display
logging.level.org.springframework=DEBUG

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=1800

# MyBatis Configuration
mybatis.mapper-locations=classpath*:mapper/*.xml

# ==============================
# Agent / LLM (Phase 1, DeepSeek)
# 在系统环境变量配置 DEEPSEEK_API_KEY，避免明文 key 提交到 git。
agent.llm.api-key=${DEEPSEEK_API_KEY:}
# 可选：DeepSeek API 基础地址（默认 https://api.deepseek.com）
agent.llm.base-url=https://api.deepseek.com
# 可选模型：deepseek-chat / deepseek-reasoner
agent.llm.model=deepseek-reasoner
# AI 总结调用模型的等待时间，单位：秒
agent.llm.summary-timeout-seconds=60

# ==============================
# Agent LLM 多模型 / 多提供方（模型切换与路由）
# 系统默认模型（用户未选择时回落）
agent.llm.default-model=deepseek-chat

# ---- Provider: deepseek ----
agent.llm.providers[0].id=deepseek
agent.llm.providers[0].display-name=DeepSeek
agent.llm.providers[0].type=OPENAI_COMPATIBLE
agent.llm.providers[0].endpoints[0].base-url=https://api.deepseek.com
agent.llm.providers[0].endpoints[0].api-key=${DEEPSEEK_API_KEY:}
agent.llm.providers[0].endpoints[0].weight=1

# ---- Provider: openai-compat（骨架，暂无默认模型，后续按需加 model）----
agent.llm.providers[1].id=openai-compat
agent.llm.providers[1].display-name=OpenAI Compatible
agent.llm.providers[1].type=OPENAI_COMPATIBLE
agent.llm.providers[1].endpoints[0].base-url=${OPENAI_COMPAT_BASE_URL:}
agent.llm.providers[1].endpoints[0].api-key=${OPENAI_COMPAT_API_KEY:}
agent.llm.providers[1].endpoints[0].weight=1

# ---- Models（上架给用户的可选模型）----
agent.llm.models[0].id=deepseek-chat
agent.llm.models[0].display-name=DeepSeek Chat
agent.llm.models[0].provider-id=deepseek
agent.llm.models[0].enabled=true

agent.llm.models[1].id=deepseek-reasoner
agent.llm.models[1].display-name=DeepSeek Reasoner
agent.llm.models[1].provider-id=deepseek
agent.llm.models[1].enabled=true

# 未来在 openai-compat 上加模型示例（当前不配 → 列表里就没有 OpenAI 模型）
#agent.llm.models[2].id=gpt-4o-mini
#agent.llm.models[2].display-name=GPT-4o mini
#agent.llm.models[2].provider-id=openai-compat
#agent.llm.models[2].enabled=true

# ==============================
# Agent Chat（多轮对话/工具调用）
# 注：chat 模型实际由 agent.llm.default-model + 用户偏好经 LlmRouter 解析，
#     下面这项已不再被 LlmGateway 读取，仅保留以兼容历史配置文件。
agent.chat.model=deepseek-chat
# 单次用户输入最多允许的 ReAct 步数（防工具循环）
agent.chat.max-steps=24
# 短期会话窗口大小（条数）
agent.chat.history-window=30
# 会话空闲多少分钟后归档为长期记忆（由 SessionArchiveScheduler 读取）
agent.chat.session-idle-archive-minutes=30
# 空闲归档扫描间隔（毫秒，fixedDelay：上一轮跑完再计时），默认 5 分钟
agent.chat.archive-sweep-interval-ms=300000

# ------------------------------
# 显式 Reflexion（方案 D）：工具失败时按失败模式注入差异化策略，并在执行层强制阻断
# 两层机制：
#   1) 建议层——按 参数错误 / 资源不存在 / 权限拒绝 / 用户拒绝 / 工具不存在 / 偶发故障
#      六类失败给出「该重试还是该换路」的具体指引；
#   2) 强制层——同一工具在单轮内失败达到阈值后封禁，模型若无视提示再次调用则直接短路
#      返回 TOOL_BANNED_THIS_TURN，不真正执行（提示层模型可能不遵从，这层才是硬约束）。
# 状态为「单轮作用域」，下一轮用户输入自动重置，不会误伤已补齐信息的重试。
# false 时退化为改造前的隐式 Reflexion（仅原样回灌错误 JSON）。
agent.chat.reflexion.enabled=true
# 同一工具单轮内失败多少次后强制封禁。
# 不可重试的失败模式（权限拒绝/用户拒绝/工具不存在/资源不存在）不受此阈值约束，一次即封禁。
agent.chat.reflexion.fail-threshold=2

# ------------------------------
# 工具参数前置校验（方案 E）：调用前按 @ToolParam / MCP inputSchema 校验，
# 失败时返回逐参数定位的可操作错误（含 expectedParams 与 hint），而不是笼统的异常名。
# 设计约束「宁松勿严」：只拦截必然失败的形状错误，接受 Jackson 默认的标量强转，
# 避免拒掉本来能成功的调用（假阳性比不校验更糟）。
# false 时退化为改造前行为（错误在反射阶段抛出）。
agent.tool.validate-args=true

# ------------------------------
# 工具运行时可见性（方案 K）：按 scope 链（GLOBAL→MODE→ROLE→SESSION）实时计算可见工具，
# 支持显式 deny（learn/reflect 模式禁写）与 pin，并产出可解释决策链。
# 修掉「learn 模式因 tag OR 语义仍能看到 note.create 等写工具」的 bug。
# false 时回退到旧的 tag 过滤路径（PromptBuilder.resolveTagFilter），行为与改造前逐字节一致。
agent.tool.visibility.enabled=true
# 执行层强制（K3）：false 时仅过滤 schema（提示层），不拦截越界调用。
# 单独开关的意义：可量化「只做提示层够不够」——只开过滤时 notVisibleBlocked 为 0，
# 开强制后若 >0，即证明「模型真的会凭记忆调不可见工具」。
agent.tool.visibility.enforce=true
# K5：子代理是否继承主对话 mode 的 deny（如 learn 模式委派 PLANNER 时写工具仍不可见）。
agent.tool.visibility.subagent-inherits-mode=true
# K4：会话层规则空闲过期（分钟），与会话归档阈值对齐。
agent.tool.visibility.session-mask-expire-minutes=30

# ------------------------------
# 轮次收尾解耦（方案 L，L3）：收尾前询问顾问（TurnStoppingAdvisor），
# 顾问可返回 steer 消息让轮次继续，把「何时结束」从循环内部解耦到可插拔的外部。
# false 时行为与 L1+L2 一致（不询问顾问）。
agent.chat.turn-stopping.enabled=true
# 单轮 steer 硬上限（Bus 强制，顾问无法绕过）——防无限循环 + 无限 LLM 调用。
agent.chat.turn-stopping.max-steer-per-turn=1
# 内置顾问：降级明示（本轮发生截断/CRAG 降级但答复未说明时，强制补一句诚实声明）
agent.chat.turn-stopping.degrade-disclosure.enabled=true
# 内置顾问：主动衔接（复盘类对话收尾前，明日到期任务达阈值时主动追问排期）
agent.chat.turn-stopping.proactive-follow-up.enabled=true
agent.chat.turn-stopping.proactive-follow-up.due-threshold=3

# ------------------------------
# 工具提前收尾（方案 L，L6）：工具返回 _concludesTurn=true + _finalText 时，
# 无需再走一步 LLM 转述，直接用 _finalText 收尾（省一次 LLM 调用）。
# 默认关闭：风险是用户意图可能是多步的（"先复盘，再把没做完的顺延"），
# 提前收尾会吞掉后续意图。个人助手一轮通常 2~5 步，省一次调用的收益远小于该代价。
agent.chat.tool-conclude.enabled=false

# ==============================
# SubAgent（子代理 / Orchestrator-Worker，S1 串行内核）
# 子代理在独立上下文跑 ReAct，只回压缩结论，防止主对话上下文被长文档/中间数据污染。
# 单个子代理最大推理步数（独立于主 agent.chat.max-steps）
agent.subagent.max-steps=12
# 子代理结论回灌主上下文前的最大字符数（截断防爆 token）
agent.subagent.result-max-chars=4000
# 并行 fan-out（subagent.parallel_research）：固定线程池大小 = 子问题并发上限（同时也是截断上限）
agent.subagent.parallel.size=4
# 并行 fan-out 总超时（秒）：超时未完成的 worker 在汇总时降级标注
agent.subagent.parallel.timeout-seconds=120

# ==============================
# Agent Embedding（PKM-RAG Stage 2）
# DeepSeek 不提供 embedding；此处指向独立的 OpenAI-Compatible 端点。
# 推荐：硅基流动 BAAI/bge-m3（免费、1024 维、中英双语）
#       https://api.siliconflow.cn  + 控制台申请的 SF_API_KEY
# 也可切换：智谱 / 通义 / 本地 Ollama nomic-embed-text（base-url=http://localhost:11434）
# 留空 base-url / api-key 时回落到 agent.llm.* 配置（仅当上游同时支持 chat & embedding 时可用）。
agent.embedding.model=BAAI/bge-m3
agent.embedding.base-url=https://api.siliconflow.cn
# 在系统环境变量配置 EMBED_API_KEY，避免提交到 git
agent.embedding.api-key=${EMBED_API_KEY:}

# ==============================
# PKM RAG 检索调权（Stage 2）
# alpha：向量分量权重；1-alpha 为关键字 RRF 占比。0.4 为均衡偏关键字。
pkm.rag.alpha=0.4
# 关键字 / 向量各自候选取多少条入融合池
pkm.rag.candidates=50
# 默认返回 topK（kb.semantic_search 未传 topK 时使用）
pkm.rag.topK=6

# ==============================
# PKM RAG 向量缓存（Stage 3；V4 P0a 改造容量口径）
# Caffeine LRU：缓存反序列化后的 float[]，避免每次 search 重复 JSON → float[] 的瓶颈。
#
# V4 为什么把 max-users 换成 max-vectors：
#   原口径按「用户数」计容，但单用户的向量体积可差三个数量级——
#   一个 172 万字符的知识仓库约 2900 chunk × 1024 维 ≈ 12MB，
#   32 个这样的用户就是 380MB+，JVM 默认堆直接 OOM。
#   瓶颈是内存而非算力，故改为按向量条数计权（Caffeine maximumWeight）。
#   同时缓存按 (userId, scopeKey) 分桶：笔记与各知识仓库互不干扰，
#   查一个仓库不必扫描该用户的全部向量。
# - max-vectors：全局驻留向量条数上限，20000 条 ≈ 80MB。
# - expire-minutes：访问后 N 分钟无活动则释放。
# - 写时失效由 NoteIndexService（笔记桶）与 RepoIndexer（仓库桶）分别负责。
pkm.rag.cache.max-vectors=20000
pkm.rag.cache.expire-minutes=30


# ==============================
# 主动式 Agent · 晨报 / 晚报（Proactive Report）
# 复用「事件链 + Insight 评分 + AI 复盘 + Electron 桌面通知」，到点主动找用户两次。
# 客户端（Electron）每 60s 轮询 /report/pending；服务端按下列时间窗 + 每日一次闸门返回。
report.proactive.enabled=true
# 晨报触发窗口 [start, end)，24 小时制；窗口内首次轮询推送一次
report.proactive.morning.window-start-hour=8
report.proactive.morning.window-end-hour=11
# 晚报触发窗口 [start, end)；end=24 表示直到当天结束
report.proactive.evening.window-start-hour=21
report.proactive.evening.window-end-hour=24
# Scheduler 预生成时刻（Spring cron：秒 分 时 日 月 周）；含 LLM 的晚报预生成收益最大
report.proactive.morning.cron=0 0 8 * * *
report.proactive.evening.cron=0 0 21 * * *
# 「最近活跃」判定窗口（分钟）：只为这段时间内仍在轮询的在线用户预生成报告
report.proactive.active-window-minutes=15

# ==============================
# 异步任务池（PKM 索引重建 / 复盘等）
# 笔记保存后通过 NotePersistedEvent 触发，在此池中异步执行 embedding 调用
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.thread-name-prefix=pkm-

# ==============================
# MCP Server（Model Context Protocol）
# 是否启用 MCP Server（SSE 端点 + 工具注册）
mcp.server.enabled=true
# SSE 端点路径（客户端连接地址：http://host:port/sse?token=lattice_xxx）
mcp.server.sse-path=/sse
# 消息端点路径
mcp.server.message-path=/mcp/message
# S4：本地文件访问（MCP 专用，替代 Electron Bridge）
# 开启后 MCP 客户端可调用 local.list_dir / local.read_file / local.read_pdf / local.read_document
mcp.server.local-files-enabled=true
# 本地文件白名单目录（逗号分隔）。留空则自动使用用户主目录，桌面/文档等均自动可用。
mcp.server.local-allowed-dirs=

# ==============================
# MCP Client（连接外部 MCP Server）
# 是否启用 MCP Client
mcp.client.enabled=true
# ---------- MCP Server: brave-search ----------
#mcp.client.servers.brave-search.url=http://localhost:3001/sse
#mcp.client.servers.brave-search.token=
#mcp.client.servers.brave-search.enabled=true
# ---------- MCP Server: filesystem ----------
#mcp.client.servers.filesystem.url=http://localhost:3002/sse
#mcp.client.servers.filesystem.token=
#mcp.client.servers.filesystem.enabled=true
# ---------- MCP Server: loopback（Agent 连接本机 MCP Server，v3 新增）----------
# token 留空时，McpClientManager 会自动为首个用户生成（如有需要也可手动指定）
mcp.client.servers.loopback.url=http://localhost:8080/sse
mcp.client.servers.loopback.token=
mcp.client.servers.loopback.enabled=true
mcp.client.servers.loopback.connect-timeout=10
mcp.client.servers.loopback.call-timeout=30

# ==============================
# Agent 前缀缓存（Prefix Caching）
# 缓存 system prompt 构造结果，避免每步 ReAct 重复 exportSchemas + format
# prefixHash 可用于观测服务端 prompt cache 命中情况
agent.prefix-cache.enabled=true
agent.prefix-cache.max-entries=256
agent.prefix-cache.expire-minutes=120

# ==============================
# 上下文工程 P1 · 滚动摘要 + Facts 层
# ------------------------------
# 把「窗口超限即丢弃」升级为「折叠成摘要」，把「会话后画像」升级为「会话内事实」。
# 详见 docs/design/上下文工程-滚动摘要与Facts层设计.md
#
# 总开关。默认 false：滚动摘要引入额外 LLM 调用，facts 抽错会污染每一轮。
# 建议先只开 compaction（不碰 system prompt，零缓存风险），确认摘要质量后再开 facts。
agent.context.compaction.enabled=false
agent.context.facts.enabled=false

# 触发折叠的窗口占用比例（0.8 = 窗口用到 80% 时折叠）
agent.context.compaction.trigger-ratio=0.8
# 单次折叠的消息条数
agent.context.compaction.fold-size=10
# 摘要长度上限（字符）
agent.context.compaction.summary-max-chars=200
# 触发折叠所需的最少真实对话条数（剔除工具噪声后；不足则纯丢弃、不付 LLM 调用）
agent.context.compaction.min-dialogue=6

# facts 注入上限
agent.context.facts.max-stable=20
agent.context.facts.max-volatile=15
# 抽取置信度下限：低于 MEDIUM 的候选直接丢弃（宁缺勿错）
agent.context.facts.min-confidence=MEDIUM
# 稳定 facts 的生效粒度：DAY = 攒到次日生效（不打穿上游 prompt cache）
agent.context.facts.stable-apply-granularity=DAY

# ==============================
# CRAG / Self-RAG（纠正式检索）
# 检索质量评估 + 查询改写 + 降级分支
# enabled=false 时退化为一次普通检索（不改写、不重检索、degraded 恒 false）
# upper/lower：融合分数阈值（CORRECT≥upper > AMBIGUOUS≥lower > INCORRECT）
pkm.crag.enabled=true
pkm.crag.upper=0.6
pkm.crag.lower=0.4

# ==============================
# PKM RAG Serving（RAG 查询侧服务化）
# R1 语义查询缓存
pkm.rag.serving.query-cache.enabled=true
pkm.rag.serving.query-cache.threshold=0.93
pkm.rag.serving.query-cache.max-per-user=32
pkm.rag.serving.query-cache.max-users=64
# R2 LLM-as-Ranker 二阶段精排（默认关，联调稳定后开）
pkm.rag.serving.rerank.enabled=false
pkm.rag.serving.rerank.candidate-n=20
# R3 异步检索线程池
pkm.rag.serving.pool.core-size=1
pkm.rag.serving.pool.max-size=2
pkm.rag.serving.pool.queue-capacity=64

# ==============================
# AI-Infra 可观测端点（均需登录）
# 三大计划（RAG Serving / CRAG / Prefix Caching）的运行时指标暴露：
#   GET /api/pkm/rag/stats             → RAG Serving 指标 + CRAG 指标 + 缓存 stats
#   GET /api/agent/prefix-cache/stats  → 前缀缓存命中率 + 上游 prompt cache token
#   GET /api/codex/stats               → V4 知识仓库指标
#   GET /api/observability/stats       → 以上汇总
# 指标为进程内累计值（重启归零），无需额外依赖与配置。

# ==============================
# V4 · Codex 知识仓库（Git-native 知识资产沉淀）
# ------------------------------
# 架构约束：Git 仓库是唯一权威源，MySQL 的 kb_* 表全部是派生索引。
# 验收标准：DELETE FROM kb_* 后调用 /api/codex/repos/{id}/rebuild，
#          文档数 / 章节 / 死链结果与增量索引完全一致。
#
# 总开关。默认 false —— 沿用项目「新能力必须可降级」原则：
# 关闭时 Codex 全部工具与端点停用，任务/目标/笔记/Agent 行为与 V3 完全一致。
codex.enabled=false

# ------------------------------
# Git 客户端：调用系统 git 子进程（而非 JGit）
# 为什么选系统 git：用户会在 IDE 里手动操作同一个工作副本，
#   两套 git 实现对 core.autocrlf / .gitattributes / credential helper 的处理差异
#   会产生极难排查的「软件看到的和我看到的不一样」。
#   尤其 blobHash 必须用 git hash-object 计算——应用层自算 SHA 在 Windows 上
#   会因行尾转换与 git 视角不一致，表现为「增量索引永远不命中」。
# git 不可用时 Codex 优雅停用并给出提示，不影响其余功能。
codex.git.executable=git
codex.git.timeout-seconds=60
codex.git.clone-timeout-seconds=300

# ------------------------------
# 索引
# max-chunks-per-document：单篇文档 chunk 上限。
#   V4 P0a 的核心修复：笔记侧上限是 64（64×600=38400 字符），
#   而知识仓库里 6 篇主干 guide 全部超过 80000 字符，最大的达 107153——
#   旧上限只能索引前 36%，且触顶时静默返回，不记日志。
#   后果比「没有检索」更糟：Agent 会声称已检索知识库，用户却据此误判「我没写过」。
#   现改为文档级上限 400，且触顶必须落库（kb_document.truncated）+ 告警 + 仪表盘红标。
# section-aware：按 ## / ### 标题先分段再切片。
#   收益有两个：chunk 自带 heading_path 与 anchor（引用可精确到 §4.6），
#   且切片边界不会随意穿过章节，避免一个 chunk 混着两个无关主题。
codex.index.max-chunks-per-document=400
codex.index.section-aware=true
codex.index.chunk-size=600
codex.index.chunk-overlap=100
# embedding 分批大小：2900 chunk 首次全量约需 90 次请求（32/批）
codex.index.embed-batch=32
# false 时只落 chunk 不做向量化（FULLTEXT 通路仍可检索），用于零成本先验证索引结构
codex.index.embed-enabled=true

# ------------------------------
# 知识仓库检索（Git 通路）
# 独立于 kb.semantic_search：后者的返回结构被方案 A 的评测 cassette 依赖，
# 改它会让既有 47 个用例全部失效。故 Git 检索走新工具 doc.search，
# 语义上也更清晰：kb = 随手写的笔记，doc = 沉淀的知识仓库。
pkm.rag.git.enabled=false
# alpha：向量分量权重；1-alpha 为关键字 RRF 占比（与 pkm.rag.alpha 同口径）
pkm.rag.git.alpha=0.4

# ------------------------------
# 仓库 Agent 约定承接（AGENTS.md / .cursor/skills/**/SKILL.md）
# 读取仓库自带的 Agent 行为约定并注入 system prompt，
# 而不是要求用户改写成本软件的格式——用户的约定是给 IDE 写的，但内容通用。
# 承接的好处：两边行为一致、零迁移成本、不用维护两份约定。
codex.conventions.max-chars=4000

# ==============================
# V4 P1 · 验证闭环（知识落地检验 · Checkpoint）
# ------------------------------
# 这一期回答的问题是：怎么证明你不是「看懂了」，而是「能改能跑」。
#
# 闭环形态：
#   Guide → 检验条目 → 【先预测（不填则 run 锁定）】→ 受限执行 → 机器判定
#     ├ 通过且预测对 → 掌握度 +1
#     ├ 通过但预测错 → ★最高价值信号：结果对但因果理解错 → 建议沉淀笔记
#     └ 失败 → 按「常见失败 → 盲点」回指 guide 章节
#
# 总开关。默认 false：关闭时索引路径上不存在任何与验证相关的代码分支
# （靠事件解耦而非 if 判断，是结构性保证）。
codex.verify.enabled=false

# ------------------------------
# 预测门禁（本方案的纪律锁）
# 为什么必须是硬锁：「改完再解释，人会自动为既成结果编理由」。
# 未填预测 → run 直接拒绝，进程根本不启动。
# 两个反作弊设计（在代码里，不可配置）：
#   1. Agent 没有任何写入预测的工具，预测只能由用户经 HTTP 表单提交；
#   2. predicted_at 一旦写入即冻结，判定时对比冻结版本。
codex.verify.require-prediction=true

# ------------------------------
# 受限执行：五道闸门
#   ① mode 隔离   —— exec tag 仅在 AgentMode.VERIFY 可见（方案 K 执行层强制）
#   ② 命令白名单  —— 见下方 allowed-executables；shell 元字符一律拒绝
#   ③ 路径沙箱    —— cwd 与脚本必须在仓库内，且脚本须被 git 跟踪
#   ④ 人工确认    —— requiresConfirm=true，且硬编码禁止加入 auto-approve
#   ⑤ 运行时限制  —— 超时 / 输出上限 / 环境变量白名单 / 并发上限
#
# 为什么是白名单而非黑名单：黑名单永远列不全（rm 的变体、换行注入、
# 变量展开、别名……），漏一个就是完全绕过。白名单漏了只会让某条合法命令跑不了，
# 代价是「不够方便」而非「被攻破」。
codex.verify.allowed-executables=git,bash,sh,python,python3,cmake,ninja,make,mlir-opt,mlir-translate,iree-compile,iree-run-module,opt,llc,clang,clang++,pytest,gradle,gradlew,cargo,go,node,npm

# 超时：lab 编译类任务较慢，默认 10 分钟；上限 30 分钟
codex.verify.timeout-seconds=600
codex.verify.max-timeout-seconds=1800

# 输出上限：编译日志动辄数十 MB。截断必须可见——
# 涉及内容匹配的断言在截断后会被判为不可靠（宁可让用户重跑，
# 也不要给一个基于不完整数据的「通过」）。
codex.verify.output-limit-bytes=8192

# 并发上限：编译类任务本就吃满 CPU，并行只会互相拖慢并让耗时数据失去意义；
# 更重要的是并发会让「哪条检验改了工作副本」无法归因。
codex.verify.concurrent-limit=1

# 是否允许执行未被 git 跟踪的脚本。默认 false：
# 未纳入版本控制 = 无法审计其来源与变更历史。
codex.verify.allow-scripts-outside-git=false

# ------------------------------
# 隔离强度的如实声明（无对应配置项，仅作说明）
# 这里没有容器隔离。个人单机软件引入 Docker 依赖不现实，
# 且 lab 脚本依赖本机 conda 环境，容器内跑不通。
# 真实风险模型 ≈「用户自己在终端敲这条命令」：在其本机、经其逐次确认、
# 跑其自己仓库里被 git 跟踪的脚本。如实说明这一点比假装沙箱更负责。

# ==============================
# V4 P2 · 沉淀 + PR + 知识 CI
# ------------------------------
# 这一期把三条原本靠人自觉的约定变成机器门禁：
#   ① 笔记必须挂回 guide（漏挂 → CI 报 ERROR）
#   ② 示例必须入库（删成摘要 → doc.write 直接拒绝写入）
#   ③ 改动必须经审阅（分支 + PR，永不向默认分支提交）
#
# 写入总开关。默认 false —— 这是本项目里副作用最重的能力：
# 它会真实修改用户 git 工作副本里的文件。关闭时 CI（只读）仍可用。
codex.write.enabled=false

# ------------------------------
# 写入路径白名单（★最重要的一条安全边界）
# 只允许在 docs/notes/ 下新建笔记。既有 guide 一律不可被整体改写，
# 只能通过 doc.insert_backref 插入一行速记引用。
#
# 为什么这样划：用户 6 篇主干 guide 累计 40 万字符、数月写成；
# 给模型改写它们的能力，收益是省几分钟排版，风险是一次幻觉造成不可逆内容损失。
# 而在 notes/ 下新建文件最坏后果只是多一篇没用的笔记，删掉即可。
# 这条边界让「Agent 破坏语料」在结构上不可能发生，
# 而不是依赖 prompt 里写「请不要改动无关章节」。
codex.write.allowed-paths=docs/notes/**/*.md
codex.write.note-dir=docs/notes

# 笔记体积上限：笔记应当短。超限往往说明它其实是一篇 guide，应由人手动创建。
codex.write.max-note-chars=20000

# ------------------------------
# 分支命名空间
# 统一前缀让「哪些分支是软件建的」一目了然，从而可以安全地批量清理；
# 同时 discardBranch 只允许删这个命名空间下的分支——用户自己的分支不在处置范围内。
codex.write.branch-prefix=lattice/

# 是否允许在默认分支上直接写。默认 false：
# 默认分支上的提交不经审阅即进入历史，而 Agent 起草的内容必须先被人看过。
# 知识库一旦被未审阅的内容污染，用户会永久失去对整个库的信任，
# 此后每条检索结果都要复核，产品价值归零。
codex.write.allow-on-default-branch=false

# 审阅 diff 的显示上限。截断处会显式标注——
# 审阅者若不知道自己没看全，「看过 diff 才合并」这道人工闸门就是假的。
codex.write.diff-max-chars=20000

# ------------------------------
# GitHub PR（可选能力，不配则流程停在本地分支）
# provider=LOCAL 是一等公民：不连远端也要能全功能运行，审阅这一环并不缺失，
# 只是少了远端协作。把 GitHub 做成必需会让「离线也能用自己的知识库」失效。
#
# 凭证不落库：knowledge_repo.token_ref 存的是【环境变量名】而非 token 本身。
# 明文 token 进数据库后，任何一次备份、日志转储、截图都可能把它带出去，
# 而 GitHub token 的权限通常远超本软件所需。
# 下面这个全局配置项是兜底，建议留空、改用仓库上的 tokenRef。
codex.github.token=
codex.github.api-base=https://api.github.com
codex.github.timeout-seconds=30

# ------------------------------
# 知识 CI（只读，默认可用）
# 九项检查全部只读，绝不修改文件。理由不是保守而是职责边界：
# 「发现问题」与「修改内容」混在一起时用户无法信任报告——
# 他会怀疑报告是为了让修改看起来必要。
#
# 单项发现条数上限：超出会追加一条自报截断的 WARN，不静默丢弃。
codex.ci.max-findings-per-check=200

# ==============================
# V4 P3 · 知识缺口三源合流
# ------------------------------
# 这一期回答的问题是：**我不知道自己不知道什么。**
# 人无法凭回忆列出自己的盲区——盲区之所以是盲区，正因为想不起来。
# 但它在行为里留了痕，本期把三类痕迹攒起来：
#
#   ① CRAG          问了但库里没有。已有信号，此前只用来让 Agent 降级措辞，用完即丢。
#   ② SKIP_RECALL ★ 当初判定「先跳过（遇到再学）」的概念现在被反复问到。
#                   用户每篇 guide 都写了跳过清单，但「遇到了」这件事此前完全无人监测——
#                   止损线只能单向生效。本期让它可召回。
#   ③ CP_FAIL / CP_MISPREDICT ★  以为懂了但没懂。质量最高，因为有机器判据。
#
# 闭环：缺口 →（可选）GitHub Issue → 学习计划（复用既有目标体系）
#      → 学完沉淀文档 → 关闭缺口（须给证据文档）
#
# 首尾都能被现有指标量化：入口是 CRAG 的 degradedRate，出口是缺口关闭数。
# degraded 率单调下降 = 知识体系真的在长——这个指标无法靠「多写几篇文档」刷上去。
#
# ------------------------------
# 总开关。默认 false，原因不只是谨慎：
#   缺口登记挂在 kb.semantic_search / doc.search 的调用路径上，
#   而【评测套件也会走这两个工具】。若默认开启，跑一次 agentEval 就会往台账
#   灌进几十条来自测试用例的假缺口——而 kb_gap 是本期唯一不可从仓库重建的表，
#   污染了没法靠重建索引洗掉。
codex.gap.enabled=false

# ------------------------------
# 止损线召回阈值：某个「先跳过」的概念被问到几次才登记为缺口。
#
# 为什么不是 1：一次提到很可能只是顺带提及（「这个先不管」）。
# 反复被问才说明它真的挡路了。阈值把「偶遇」与「绕不开」区分开——
# 这个区分正是「遇到再学」里「遇到」二字的实际含义。
codex.gap.skip-recall-threshold=3

# ------------------------------
# 待处理缺口上限。达到后停止新增（而非丢弃最老的——最老的往往最该补）。
# 无上限增长会让看板失去可用性：几百条待处理等于没有优先级。
codex.gap.max-open=200

# ------------------------------
# 关于「不做语义聚类」的说明（无对应配置项）
# askCount 的定位是【排序键】而非统计量：它回答「我该先补哪个」，
# 不回答「这个问题我精确问过 N 次」。
# 因此归一化只做词法处理，不引入 embedding 聚类：
#   过度聚合的危害是不对称的——把两个不同缺口合成一条会让 askCount 虚高、
#   且指向一个模糊的问题，转成学习计划时无法执行；
#   而分成两条只是让看板多一行。拿不准时宁可分开。

# ==============================
# V4 P4 · 蒸馏 + 定线
# ------------------------------
# 三件事：原料→Guide 草稿（DISTILLER）、Guide→检验题（EXAMINER）、
#        「我现在该干什么」+ 读做验阶段表（ROUTER）。
#
# ★本期新增的最重要一条安全语义是 create-only（见下），
#   而不是任何一个新功能本身。
#
# ------------------------------
# 写入白名单第二类：只准新建的路径
# 语义是「路径允许写，但仅当目标文件不存在」。
#
# 为什么必须新增这一类而不是把目录加进 codex.write.allowed-paths：
# paper-notes 与 checkpoints 里已有用户手写的高质量内容（9 册检验、86 条题）。
# 若加进可覆盖白名单，P2 建立的「Agent 不可能弄坏语料」这条结构性保证会当场作废——
# doc.write 的 REPLACE 模式立刻就能整体改写它们。
# 有了 create-only：新建蒸馏草稿可行，改写既有检验册在结构上不可能。
#
# ★刻意不含 docs/learning-guides/，尽管蒸馏官方文档时放那里更自然。
# 白名单能不加就不加：多一个目录就多一批「只校验了路径合法性、没校验覆盖权」的
# 写入路径需要逐个复核，而 P2 那句「既有 guide 一律不可写」也就不再逐字成立。
# 蒸馏产物先落 paper-notes，要挪去 learning-guides 请在 IDE 里手动移动——那本该是你的决定。
codex.write.create-only-paths=docs/paper-notes/**/*.md,docs/checkpoints/**/*.md

# 蒸馏产物体积上限。远宽于笔记的 2 万：用户既有 guide 单篇 4~8 万字符，
# 用同一个上限会让蒸馏在最后一步被自己的门禁拒掉，而前面每步都成功了——那种失败最令人困惑。
codex.write.max-guide-chars=80000

# ------------------------------
# 蒸馏总开关。默认 false，原因是成本而非风险：
# 一篇论文会被切成多段，每段一次 LLM 调用，再加一次汇总，单篇约 5~9 次调用。
# 起草本身不碰磁盘，落盘还需要 codex.write.enabled——两个开关刻意分开，
# 好让你先在零风险下看几篇产物质量，再决定给不给它写文件的权限。
codex.distill.enabled=false

# 原料读取上限。超出截断并在「待人工核对」里自报——
# 不自报的话用户会以为这篇 guide 覆盖了整份原料。
codex.distill.max-source-chars=200000

# 单段字符数。按论文章节切，切不出结构时才退化为定长。
# 不按固定长度硬切的理由：Method 与 Experiments 要分别喂进不同的抽取任务，
# 硬切会把一节劈成两半，让模型在两次调用里各看到半个算法，于是两次都只能写出模糊的概括。
codex.distill.chunk-chars=9000

# 最多蒸馏几段（成本闸门）。超出即截断并自报。
codex.distill.max-chunks=8

# 蒸馏产物目录。必须在 create-only 白名单内，否则落盘会被闸门拒绝。
codex.distill.output-dir=docs/paper-notes

# ------------------------------
# 出题总开关。默认 false 的理由与蒸馏不同，是指标完整性：
# 机器出的题会进入 kb_checkpoint，而 checkpoint 通过率是本产品唯一
# 号称「无法造假」的指标。一个被污染的无法造假的指标比没有这个指标更糟，
# 因为用户仍会相信它。
#
# 已做的两道防线：
#   ① verify_source=AGENT_DRAFT，统计口径上与人写的题分开，永不合并；
#   ② 验收命令引用的路径必须在磁盘上真实存在，否则整条题丢弃（不是降级）。
codex.exam.enabled=false

# 单次出题上限。
codex.exam.max-items=4

# 喂给出题的文档字符上限（超出截断）。
codex.exam.guide-max-chars=30000

# 检验册产物目录。同样必须在 create-only 白名单内。
codex.exam.output-dir=docs/checkpoints

# ------------------------------
# 关于定线（ROUTER）为什么没有配置项
# 因为它一次 LLM 都不调。
#
# 设计文档把 ROUTER 列为子代理角色，这里没有那样实现：
# README §0 的「P0 投入 60% / P1 30%」是用户对自己时间的主观分配，
# 机器没有依据去改它；让 LLM 生成一份"建议的阶段表"只会产出一份
# 看起来合理、但用户无法核对的东西——而无法核对的建议最终只会被忽略。
#
# 软件真正能提供的增量在别处：周次表已经写好了，但每天要人工对照
# 「我在哪一周、这周该验哪几条」。这件事是纯计算，且结论可以逐条核对——
# 每条建议都附上它依据的那条记录。可核对比更聪明重要。



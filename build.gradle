plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '8.6'
}

group = 'org.zhzssp'
version = '0.0.1-SNAPSHOT'
description = 'This is a memorandum system supporting multi-user background.'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.jetbrains:annotations:24.0.1'
	implementation 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Spring Boot WebSocket 依赖
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // Spring Boot Web依赖，包含WebSocket支持
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 热部署
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // PKM：Markdown 渲染（V4 PKM 升级）
    implementation 'org.commonmark:commonmark:0.22.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.22.0'
    implementation 'org.commonmark:commonmark-ext-task-list-items:0.22.0'

    // PKM-RAG Stage 3：用户级向量 LRU 缓存（避免每次 search 全表 deserialize）
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // MCP 本地文档解析：PDF / Word / Excel
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Agent 评测体系：内存库用于装配 Spring 上下文（不跑 MySQL 原生 SQL，那部分由 mock 替代）
    testImplementation 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform {
		// 能力集永远不参与 `test`：它的用例<按定义>就是现在做不到的，
		// 留在这里只会让 `gradlew test` 长期挂红，最后逼着人去改断言。
		// 它有自己的入口：gradlew agentEvalCapability
		excludeTags 'agent-eval-capability'
		// 默认跳过需要真实 MySQL / 外部服务的集成测试；用 -Pintegration 打开
		if (!project.hasProperty('integration')) {
			excludeTags 'integration'
		}
	}
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat = 'full'
		showStandardStreams = false
	}
}

/**
 * Agent 评测任务：只跑评测套件并输出指标报告。
 *   ./gradlew agentEval                              回放模式（离线、零成本）
 *   ./gradlew agentEval -Dagent.eval.mode=record     录制模式（需 DEEPSEEK_API_KEY，产生真实调用）
 *   ./gradlew agentEval -Dagent.eval.trials=3        每个用例跑 3 次，产出 pass@k / pass^k
 *   ./gradlew agentEval -Dagent.eval.budget=write    重写成本预算基线（P5），产出待评审的 diff
 *
 * 试次数需先有对应的多试次录制：
 *   ./gradlew agentEval -Dagent.eval.mode=record -Dagent.eval.trials=3
 *
 * ── 能力集 vs 回归集（P5）─────────────────────────────────────────
 * agentEval          只跑<回归集>，判红即拦 PR。目标通过率≈100%，掉了就是 bug。
 * agentEvalCapability 只跑<能力集>，ignoreFailures=true，永不拦 PR。
 *                    目标通过率 30~60%——它存在的意义就是<现在做不到>，
 *                    是一座要爬的山，不是一道要守的门。夜间 / 发版前跑。
 *
 * 为什么必须分开：两者混在一个套件里时，只有两种结局——
 * 要么为了让 CI 变绿而把难用例的断言改松（于是它不再是山），
 * 要么难用例根本不会被加进来（于是评测永远只覆盖已经做到的事）。
 * 全绿的套件能追踪回归，但对「下一步该改进什么」零信号。
 *
 * 流转规则见 docs/Agent评测体系使用指南.md：稳定通过的<毕业>进回归集；
 * 连续多月 100% 且不再变化的<退休>（防评测饱和）。
 */
def configureAgentEval = { Test t ->
	t.group = 'verification'
	t.testClassesDirs = sourceSets.test.output.classesDirs
	t.classpath = sourceSets.test.runtimeClasspath
	t.systemProperty 'agent.eval.mode', System.getProperty('agent.eval.mode', 'replay')
	t.systemProperty 'agent.eval.trials', System.getProperty('agent.eval.trials', '1')
	t.systemProperty 'agent.eval.budget', System.getProperty('agent.eval.budget', '')
	t.testLogging {
		events 'passed', 'failed'
		exceptionFormat = 'full'
		showStandardStreams = true
	}
	t.outputs.upToDateWhen { false }
}

tasks.register('agentEval', Test) {
	description = 'Agent 回归集：判红即拦 PR'
	configureAgentEval(it)
	useJUnitPlatform {
		includeTags 'agent-eval'
		excludeTags 'agent-eval-capability'
	}
}

tasks.register('agentEvalCapability', Test) {
	description = 'Agent 能力集：只报不拦，目标通过率 30~60%'
	configureAgentEval(it)
	useJUnitPlatform {
		includeTags 'agent-eval-capability'
	}
	// ★ 不拦 PR 是这个套件的<定义>，不是妥协。
	// 一旦它能拦 PR，下一次它变红时被改的一定是断言，而不是 Agent。
	ignoreFailures = true
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '8.6'
}

group = 'org.zhzssp'
version = '0.0.1-SNAPSHOT'
description = 'This is a memorandum system supporting multi-user background.'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.jetbrains:annotations:24.0.1'
	implementation 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Spring Boot WebSocket 依赖
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // Spring Boot Web依赖，包含WebSocket支持
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 热部署
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // PKM：Markdown 渲染（V4 PKM 升级）
    implementation 'org.commonmark:commonmark:0.22.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.22.0'
    implementation 'org.commonmark:commonmark-ext-task-list-items:0.22.0'

    // PKM-RAG Stage 3：用户级向量 LRU 缓存（避免每次 search 全表 deserialize）
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // MCP 本地文档解析：PDF / Word / Excel
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Agent 评测体系：内存库用于装配 Spring 上下文（不跑 MySQL 原生 SQL，那部分由 mock 替代）
    testImplementation 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
	// 默认跳过需要真实 MySQL / 外部服务的集成测试；用 -Pintegration 打开
	if (!project.hasProperty('integration')) {
		useJUnitPlatform {
			excludeTags 'integration'
		}
	}
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat = 'full'
		showStandardStreams = false
	}
}

/**
 * Agent 评测任务：只跑评测套件并输出指标报告。
 *   ./gradlew agentEval                              回放模式（离线、零成本）
 *   ./gradlew agentEval -Dagent.eval.mode=record     录制模式（需 DEEPSEEK_API_KEY，产生真实调用）
 */
tasks.register('agentEval', Test) {
	group = 'verification'
	description = 'Run Agent evaluation suite (trajectory replay + metrics report)'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'agent-eval'
	}
	systemProperty 'agent.eval.mode', System.getProperty('agent.eval.mode', 'replay')
	testLogging {
		events 'passed', 'failed'
		exceptionFormat = 'full'
		showStandardStreams = true
	}
	outputs.upToDateWhen { false }
}
